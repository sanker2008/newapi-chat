name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      APK_ARCH: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test protocols and persistence
        run: npm test
      - name: Check Android JavaScript bundle
        run: npx expo export --platform android --output-dir .ci-bundle --max-workers 2
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Install available Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build standalone test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -Pandroid.compileSdkVersion=36 -Pandroid.targetSdkVersion=36 -Pandroid.buildToolsVersion=36.0.0 \
            -PreactNativeArchitectures="$APK_ARCH" \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.caching=true \
            '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m'
      - name: Verify APK and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/ants-chat-1.0.0-$APK_ARCH-test.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "artifacts/ants-chat-1.0.0-$APK_ARCH-test.apk"
          python - <<'PY'
          import os, zipfile
          arch = os.environ['APK_ARCH']
          with zipfile.ZipFile(f'artifacts/ants-chat-1.0.0-{arch}-test.apk') as apk:
              arches = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
              assert arches == {arch}, f'Expected only {arch}, got {arches}'
              assert 'assets/index.android.bundle' in apk.namelist(), 'Missing standalone JS bundle'
          print(f'Verified single-ABI standalone APK: {arch}')
          PY
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Commit: %s\nVersion: 1.0.0\nSigning: Android debug/test key (NOT a store release)\nArchitecture: %s\nMetro required: no\n' "$GITHUB_SHA" "$APK_ARCH" > artifacts/BUILD-INFO.txt
          echo '### Ants Chat 1.0.0 测试 APK' >> "$GITHUB_STEP_SUMMARY"
          echo '包含 JS，可独立运行；使用 Android 测试签名，不能直接用于正式上架。下载下方 APK artifact。真实 API 需要在 App 内自行配置。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ants-chat-1.0.0-${{ matrix.abi }}-test-apk
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
